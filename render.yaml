services:
  - type: web
    name: device-stream-hub
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_SECONDS
        value: "1800"
      - key: SESSION_SECRET
        generateValue: true
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false